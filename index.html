<!DOCTYPE html>
<html>
<head>
    <title>todoアプリ</title>
</head>
<body>
    <h1>タスク一覧</h1>
    <form method="POST" action="/add">
        <input type="text" name="title" placeholder="タスクを入力">
        <button type="submit">追加</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li> {{ task[1] }} </li>
        {% endfor %}
    </ul>
</body>
</html>

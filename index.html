<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>todoアプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>タスク一覧<a href="/logout" class="logout">Logout</a></h1>
        <form method="POST" action="/add">
            <input type="hidden" name="sort" value="{{ request.args.get('sort', 'new') }}">
            <input type="text" name="title" placeholder="タスクを入力">
            <button type="submit">追加</button>
        </form>
        <form method="GET">
            <select name="sort">
                <option value="new">新しい順</option>
                <option value="old">古い順</option>
            </select>
            <button>並び替え</button>
        </form>
        <ul>
            {% for task in tasks %}
                <li class="task-item"> 
                    {% if task[2] %}
                        <s><span>{{ task[1] }}</span></s>
                    {% else %}
                        <span>{{ task[1] }}</span>
                    {% endif %}
                    <a href="/edit/{{ task[0] }}">編集</a>

                    <a href="{{ url_for('toggle',task_id=task[0],sort=request.args.get('sort', 'new')) }}">完了</a>
                
                    <form action="{{ url_for('delete',task_id=task[0],sort=request.args.get('sort', 'new')) }}" method="POST" style="display:inline;">
                        <button>削除</button>
                    </form>  
                </li>
            {% endfor %}
        </ul>
    </div> 
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>todoアプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <dir class="container">
        <h1>タスク一覧</h1>
        <form method="POST" action="/add">
            <input type="text" name="title" placeholder="タスクを入力">
            <button type="submit">追加</button>
        </form>
        <ul>
            {% for task in tasks %}
                <li class="task-item"> 
                    <span>{{ task[1] }}</span>

                    <a href="/edit/{{ task[0] }}">編集</a>
                
                    <form action="/delete/{{ task[0] }}" method="POST" style="display:inline;">
                        <button>削除</button>
                    </form>  
                </li>
            {% endfor %}
        </ul>
    </dir> 
</body>
</html>
